[package]
name = "oxmynd"
version = "0.17.0"
edition = "2024"
description = "A persistent memory MCP server for AI agents"
repository = "https://github.com/oxhive/mynd"
license = "AGPL-3.0-only"
keywords = ["mcp", "memory", "ai", "agent", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mynd"
path = "src/main.rs"

[lib]
name = "oxmynd"
path = "src/lib.rs"

[dependencies]
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server", "transport-child-process", "client"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["cors"] }
libsql = { version = "0.9", features = ["core", "replication"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive"] }
toml = "1.1"
tiktoken-rs = "0.12"
include_dir = "0.7"
mime_guess = "2"
regex = "1"
ratatui = "0.30.2"
crossterm = "0.29.0"
libc = "0.2.186"
matrix-sdk = { version = "0.19.1", features = ["e2e-encryption", "sqlite"] }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "cache", "model", "rustls_backend"] }
keyring-core = "1.0.0"
rpassword = "7.5.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
semver = "1"
ed25519-dalek = { version = "3", features = ["rand_core", "pkcs8", "alloc"] }
mdns-sd = "0.21.3"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
hex = "0.4.3"
rand = { version = "0.10", features = ["std"] }
rcgen = "0.14.8"
local-ip-address = "0.6.13"
sha2 = "0.11.0"
x509-parser = "0.18.1"
whichnet = "0.1"
rustls = { version = "0.23.42", features = ["ring"] }
rustls-pki-types = "1"

# Concrete keyring-core credential stores, chosen directly (see
# src/secure_store.rs) instead of via the `keyring` crate's v1 facade, which
# hardcodes one backend per platform with no fallback -- so it can't express
# "try the D-Bus secret service, then fall back to the kernel keyring on a
# headless Linux box with no D-Bus session".
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
